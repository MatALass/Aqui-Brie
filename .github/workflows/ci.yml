name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    # Hors ligne : la CI teste l'application sur l'instantané livré avec le paquet,
    # sans dépendre de la disponibilité de Hub'Eau.
    env:
      AQUIBRIE_HORS_LIGNE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Chaque page de l'application s'ouvre sans erreur
        run: |
          streamlit run app.py --server.headless=true --server.address=127.0.0.1 --server.port=8765 \
            --server.enableAgentApi=true > streamlit.log 2>&1 &
          python scripts/smoke_pages.py http://127.0.0.1:8765
      - if: failure()
        run: cat streamlit.log || true
